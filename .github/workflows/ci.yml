name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: verify-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WA_VERIFY_POSTGRES_URL: postgres://postgres:verify-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the legacy terminal script's Chromium download,
      # which CI has no use for and which dominates install time.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      # No secrets: every route in the app renders on demand, so the build
      # never reads DATABASE_URL or AUTH_SECRET. If this step ever starts
      # needing them, something has been moved to module scope by mistake.
      - name: Build web
        run: npm run build --workspace=@wa/web

      - name: Verify settings validation
        run: npm run verify --workspace=@wa/web

      # Catches a schema change committed without its migration — the most
      # likely way for production and the code to drift apart.
      - name: Check migrations are up to date
        run: |
          npm run db:generate
          if ! git diff --quiet --exit-code packages/db/drizzle; then
            echo "::error::Schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git diff --stat packages/db/drizzle
            exit 1
          fi

      # Boots a real Postgres and asserts what TypeScript cannot: that the
      # row-level security policies actually isolate tenants, that the claim
      # query is safe under concurrency, and that the search and upsert SQL do
      # what the UI assumes.
      #
      # This is not optional belt-and-braces. The first version of
      # docker-compose.yml connected the app as a superuser, which makes every
      # RLS policy silently inert — the application behaved perfectly and
      # isolation was simply gone. Only a check like this one finds that.
      #
      # The Linux embedded binary requires ICU 60, absent from modern runners.
      # Use the disposable service above; the harness creates and drops a fresh
      # database per suite and still tests a non-superuser application role.

      - name: Verify schema and isolation
        run: npm run verify --workspace=@wa/db

      # The linking handshake: three separate bugs here each left the user's
      # phone on "Logging in…" forever, and none were visible to the type
      # checker or to any single-step test.
      - name: Verify linking handshake
        run: npm run verify:linking --workspace=@wa/worker

      # Runs the real send job against a real database with a stubbed WhatsApp
      # socket: dedupe, suppression, the rolling cap, template rendering, and
      # the ledgers that back them.
      - name: Verify send pipeline
        run: npm run verify:pipeline --workspace=@wa/worker

      - name: Verify restart and ownership
        run: npm run verify:restart --workspace=@wa/worker

      - name: Verify upload budgets
        run: node --import tsx apps/web/src/testing/verify-upload.ts

      - name: Verify Linux process supervision
        run: node infra/testing/verify-launch.mjs

      - name: Build and boot combined Render image
        run: bash infra/testing/render-smoke.sh
